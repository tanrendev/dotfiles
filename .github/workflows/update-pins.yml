name: Update pins

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    name: Bump pins
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
      - run: nix run .#update-debs -- pkgs/signal-desktop pkgs/grok-bot pkgs/vscode
      - run: nix run .#update-vscode-extensions -- home/editors/extensions.json pkgs/vscode/source.json
      - run: nix flake update claude-code
      - run: >-
          nix build --no-link
          .#signal-desktop
          .#grok-bot
          .#vscode
          .#nixosConfigurations.lyngen.config.home-manager.users.tanren.home-files
          .#nixosConfigurations.lyngen.config.home-manager.users.tanren.programs.claude-code.package
      - run: .github/scripts/update-pins-pr.sh
        env:
          GH_TOKEN: ${{ secrets.FLAKE_UPDATE_TOKEN || github.token }}
