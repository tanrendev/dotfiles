[idle.behavior.lock]
action = "lock"
enabled = true
timeout = 600

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
timeout = 660

[location]
auto_locate = true

[plugins]
auto_update = "none"
enabled = ["noctalia/kaomoji"]

[[plugins.source]]
enabled = true
kind = "git"
location = "https://github.com/noctalia-dev/official-plugins"
name = "official"

[shell]
clipboard_enabled = true
launch_apps_as_systemd_services = true
polkit_agent = true

[shell.greeter_sync]
auto_sync = true

[theme]
mode = "dark"
wallpaper_scheme = "m3-content"

[weather]
enabled = true
unit = "celsius"

[widget.network]
show_label = false
