id = "tanren/modewall"
name = "Mode Wallpaper"
version = "2.0.0"
plugin_api = 9
author = "tanren"
license = "MIT"
dependencies = []
tags = ["wallpaper", "theme"]
icon = "sun-moon"
description = "One wallpaper per theme mode, applied on mode change."

[[setting]]
key = "light"
type = "file"
label_key = "settings.light.label"
description_key = "settings.light.description"
default = ""

[[setting]]
key = "dark"
type = "file"
label_key = "settings.dark.label"
description_key = "settings.dark.description"
default = ""

[[service]]
id = "service"
entry = "service.luau"
